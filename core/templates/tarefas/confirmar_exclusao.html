{% extends 'base.html' %}

{% block title %}Excluir tarefa{% endblock %}

{% block content %}
<h1>Excluir tarefa</h1>

<div class="form-card">
    <p>Tem certeza que deseja excluir "<strong>{{ tarefa.titulo }}</strong>"?</p>
    <form method="post">
        {% csrf_token %}
        <div class="acoes">
            <button class="btn btn-danger" type="submit">Sim, excluir</button>
            <a class="btn btn-secundario" href="{% url 'tarefa_lista' %}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
