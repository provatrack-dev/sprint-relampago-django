{% extends 'base.html' %}

{% block title %}Excluir projeto{% endblock %}

{% block content %}
<h1>Excluir projeto</h1>
<p>Tem certeza que deseja excluir "{{ projeto.nome }}"? As tarefas dele também serão excluídas.</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Sim, excluir</button>
</form>
<p><a href="{% url 'projeto_lista' %}">Cancelar</a></p>
{% endblock %}
