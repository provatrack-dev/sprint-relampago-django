{% extends 'base.html' %}

{% block title %}Excluir projeto{% endblock %}

{% block content %}
<h1>Excluir projeto</h1>

<div class="form-card">
    <p>Tem certeza que deseja excluir "<strong>{{ projeto.nome }}</strong>"? As tarefas dele também serão excluídas.</p>
    <form method="post">
        {% csrf_token %}
        <div class="acoes">
            <button class="btn btn-danger" type="submit">Sim, excluir</button>
            <a class="btn btn-secundario" href="{% url 'projeto_lista' %}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
